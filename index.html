$('entryForm').onsubmit=e=>{e.preventDefault();if(attachmentBusy){toast('Дождитесь обработки фото');return;}let id=$('editId').value||('e'+Date.now()+Math.random().toString(36).slice(2,7)),cat=$('cat').value,d=$('dateInput').value,end=$('endInput').value;if(end&&end<d){toast('Дата окончания раньше начала');return}let old=data.entries.find(x=>x.id===id);let item={...old,id,cat,date:d,title:$('titleInput').value.trim(),status:$('statusInput').value,notes:$('notesInput').value.trim()};if(!item.title)return;delete item.end;delete item.weight;if(end)item.end=end;if(cat==='growth'&&$('weightInput').value)item.weight=Number($('weightInput').value);item.attachments=clone(pendingAttachments);item.author=old?.author||(!old?currentAuthor:undefined);item.editedBy=currentAuthor;item.editedAt=new Date().toISOString();let next=clone(data),i=next.entries.findIndex(x=>x.id===id);if(i>=0)next.entries[i]=item;else next.entries.push(item);commit(next,()=>{editor.close();toast('Запись сохранена')})};$('main').addEventListener('click',e=>{let ics=e.target.closest('[data-ics]');if(ics){let item=data.entries.find(x=>x.id===ics.dataset.ics);if(item)downloadCalendar(item);return}let photo=e.target.closest('[data-photo-id]');if(photo){let item=data.entries.find(x=>x.id===photo.dataset.photoId),a=(item?.attachments||[]).filter(x=>imageOK(x.url))[Number(photo.dataset.photoIndex)];if(a){$('fullImage').src=a.url;$('imageView').showModal()}return}let edit=e.target.closest('[data-edit]'),done=e.target.closest('[data-done]');if(edit){let item=data.entries.find(x=>x.id===edit.dataset.edit);if(item)openEditor(item.cat,item.id)}if(done){let item=data.entries.find(x=>x.id===done.dataset.done);if(item){openEditor(item.cat,item.id);$('statusInput').value='done';$('dateInput').value=today();$('endInput').value='';toast('Уточните фактическую дату и сохраните')}}});
$('photoInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let img=await createImageBitmap(f),canvas=document.createElement('canvas'),scale=Math.min(1,700/Math.max(img.width,img.height));canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let url=canvas.toDataURL('image/jpeg',.78),next=clone(data);next.photo=url;commit(next,()=>toast('Фото обновлено'))}catch(e){toast('Не удалось открыть фото. Попробуйте JPG или PNG.')}e.target.value=''};
$('foodForm').onsubmit=e=>{e.preventDefault();let next=clone(data),f={name:$('foodName').value.trim(),grams:Number($('foodGrams').value)||null,meals:Number($('foodMeals').value)||null,since:$('foodSince').value,notes:$('foodNotes').value.trim()};if(!f.name)return;let previous=next.foodProfile;if(JSON.stringify(previous)!==JSON.stringify(f)){next.foodProfile=f;next.entries.push({id:'food'+Date.now(),cat:'food',date:f.since||today(),title:'Рацион — '+f.name,notes:[f.grams?'Суточная порция: '+f.grams+' г':'',f.meals?'Кормлений: '+f.meals:'',f.notes].filter(Boolean).join('\n'),status:'done',author:currentAuthor})}commit(next,()=>{$('foodDialog').close();toast('Рацион сохранён')})};
$('addImport').onchange=async e=>{try{if(!ready||busy)throw Error('Дождитесь синхронизации');let file=e.target.files[0];if(!file)return;if(file.size>5000000)throw Error('Файл слишком большой');let pack=JSON.parse(await file.text());if(pack.format!=='leo-add-v1'||!Array.isArray(pack.entries)||pack.entries.length>100)throw Error('Это не файл добавления записей LEO');let valid=pack.entries.every(x=>typeof x.id==='string'&&/^[a-zA-Z0-9_-]+$/.test(x.id)&&Object.hasOwn(cats,x.cat)&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&typeof x.title==='string'&&x.title.length<=200&&typeof x.notes==='string'&&['done','plan','confirm'].includes(x.status)&&(!x.attachments||Array.isArray(x.attachments)&&x.attachments.length<=6&&x.attachments.every(a=>typeof a.name==='string'&&imageOK(a.url))));if(!valid)throw Error('Некорректные записи в файле');let next=clone(data),ids=new Set(next.entries.map(x=>x.id)),fresh=[];for(let x of pack.entries){if(!ids.has(x.id)){fresh.push(x);ids.add(x.id)}}if(!fresh.length){toast('Все записи уже добавлены');return}if(!confirm('Добавить '+fresh.length+' новых записей? Существующие записи и фото Лео сохранятся.'))return;next.entries.push(...fresh);if(pack.passportReviewed===true){let p=next.entries.find(x=>x.id==='passport'&&x.status==='confirm'&&x.title==='Сверить ветеринарный паспорт');if(p){p.status='done';p.notes='Страницы паспорта сверены. Первая вакцинация и обработки внесены. Отметки о бешенстве и второй вакцинации на предоставленных страницах нет.';p.editedBy=currentAuthor;}}commit(next,()=>toast('Добавлено записей: '+fresh.length))}catch(err){toast(err.message||'Не удалось импортировать')}finally{e.target.value=''}};
function downloadCalendar(e){let clean=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');let end=new Date((e.end||e.date)+'T00:00:00Z');end.setUTCDate(end.getUTCDate()+1);let text=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//LEO//Diary//RU','BEGIN:VEVENT','UID:'+e.id+'@leo','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z'),'DTSTART;VALUE=DATE:'+e.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+end.toISOString().slice(0,10).replace(/-/g,''),'SUMMARY:'+clean('Лео: '+e.title),'DESCRIPTION:'+clean(e.notes),'END:VEVENT','END:VCALENDAR'].join('\r\n');let a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:'text/calendar;charset=utf-8'}));a.href=u;a.download='leo-event.ics';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download='leo-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}$('restore').onchange=async e=>{try{let next=JSON.parse(await e.target.files[0].text());if(!Array.isArray(next.entries)||!next.entries.every(x=>x.id&&cats[x.cat]&&x.date&&x.title&&['done','plan','confirm'].includes(x.status)))throw Error();if(confirm('Заменить текущую карту данными из резервной копии?'))commit(next,()=>toast('Копия восстановлена'))}catch(e){toast('Неверный файл резервной копии')}e.target.value=''};
if(!db){gate('Не удалось подключить библиотеку входа. Проверьте интернет.');}else{gate('Введите почту и пароль');$('loginForm').onsubmit=async e=>{e.preventDefault();$('authMsg').textContent='Входим…';try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error)throw error;}catch(e){$('authMsg').textContent='Вход не выполнен: '+e.message;}};db.auth.onAuthStateChange((event,session)=>{setTimeout(()=>{const uid=session?.user?.id||null;currentAuthor=String(session?.user?.user_metadata?.display_name||session?.user?.user_metadata?.name||session?.user?.email?.split('@')[0]||'').slice(0,80);if(uid!==currentUser){generation++;currentUser=uid;busy=false;if(uid){gate('Загружаем семейную карту…',true);remoteLoad()}else gate('Введите почту и пароль');}},0)});setInterval(()=>{if(!document.hidden&&!document.querySelector("dialog[open]"))remoteLoad()},15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!document.querySelector("dialog[open]"))remoteLoad()});}
